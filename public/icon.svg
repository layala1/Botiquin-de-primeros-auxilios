<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#042f2e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#medGrad)"/>

  <!-- First Aid Kit / Medical Case Base -->
  <g filter="url(#shadow)">
    <!-- Kit Handle -->
    <path d="M196 150 C 196 110, 316 110, 316 150" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round"/>
    
    <!-- Kit Body -->
    <rect x="96" y="150" width="320" height="250" rx="36" fill="#ffffff"/>
    
    <!-- Red/Teal Medical Cross -->
    <path d="M232 205 h48 v55 h55 v48 h-55 v55 h-48 v-55 h-55 v-48 h55 z" fill="#0d9488" rx="8"/>
    <circle cx="256" cy="281" r="14" fill="#ffffff"/>
  </g>

  <!-- Lens / Camera indicator icon at bottom right -->
  <circle cx="370" cy="370" r="46" fill="#042f2e" stroke="#ffffff" stroke-width="8"/>
  <circle cx="370" cy="370" r="26" fill="#14b8a6"/>
  <circle cx="380" cy="360" r="7" fill="#ffffff"/>
</svg>
